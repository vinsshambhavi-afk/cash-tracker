<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinsBill Cash Account Maintenance</title>
  <!-- Firebase App & Auth SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
    h2 { color: #0f172a; margin-top: 0; text-align: center; }
    input, button, select { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .dashboard { max-width: 800px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>

<!-- Admin Login Box -->
<div class="card" id="authBox">
  <h2>Admin Cash Login</h2>
  
  <!-- Step 1: Phone Input -->
  <div id="phone-step">
    <label>Admin Mobile Number (+CountryCode)</label>
    <input type="tel" id="phoneNumber" placeholder="+919876543210">
    <div id="recaptcha-container"></div>
    <button onclick="sendOTP()">Send OTP SMS</button>
  </div>

  <!-- Step 2: OTP Verification -->
  <div id="otp-step" class="hidden">
    <label>Enter 6-Digit OTP Code</label>
    <input type="text" id="otpCode" placeholder="123456">
    <button onclick="verifyOTP()">Verify & Login</button>
  </div>
</div>

<!-- Cash Management Dashboard (Hidden until logged in) -->
<div class="card dashboard hidden" id="dashboardBox">
  <h2>Cash Received Maintenance</h2>
  <button onclick="logout()" style="background: #ef4444; width: auto; padding: 6px 12px; float: right;">Logout</button>
  <div style="clear: both;"></div>

  <!-- New Cash Entry Form -->
  <h3 style="margin-bottom: 5px;">Add New Cash Receipt</h3>
  <input type="text" id="receiptNo" placeholder="Receipt Number (e.g., REC-001)">
  <input type="text" id="payerName" placeholder="Payer Name">
  <input type="number" id="amount" placeholder="Amount Received">
  <select id="category">
    <option value="Client Payment">Client Payment</option>
    <option value="Advance">Advance</option>
    <option value="Other">Other</option>
  </select>
  <button onclick="addCashRecord()">Save Cash Record</button>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

  <h3>Recent Cash Records</h3>
  <table id="recordsTable">
    <thead>
      <tr>
        <th>Receipt</th>
        <th>Payer</th>
        <th>Amount</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="4" style="text-align: center;">Loading records...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD56cdjtIWmrRZbKQPfUv6Zl-i7Vbodmz8",
    authDomain: "vinsbill-cash.firebaseapp.com",
    projectId: "vinsbill-cash",
    storageBucket: "vinsbill-cash.firebasestorage.app",
    messagingSenderId: "540825391116",
    appId: "1:540825391116:web:a3c52d46bad194d6765e29",
    measurementId: "G-VLHFX111S4"
  };
  firebase.initializeApp(firebaseConfig);

  // Invisible reCAPTCHA for phone authentication
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    'size': 'invisible'
  });

  // Live Render Backend URL
  const BACKEND_URL = "https://cash-tracker-backend-78bd.onrender.com"; 
  let authToken = "";

  // 1. Send OTP
  function sendOTP() {
    const phoneNumber = document.getElementById('phoneNumber').value;
    firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
      .then((confirmationResult) => {
        window.confirmationResult = confirmationResult;
        document.getElementById('phone-step').classList.add('hidden');
        document.getElementById('otp-step').classList.remove('hidden');
        alert("OTP sent successfully!");
      })
      .catch((error) => {
        alert("SMS Error: " + error.message);
      });
  }

  // 2. Verify OTP & Load Dashboard
  function verifyOTP() {
    const code = document.getElementById('otpCode').value;
    window.confirmationResult.confirm(code).then(async (result) => {
      authToken = await result.user.getIdToken();
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dashboardBox').classList.remove('hidden');
      fetchRecords();
    }).catch((error) => {
      alert("Invalid OTP code!");
    });
  }

  // 3. Fetch Records from Backend
  async function fetchRecords() {
    try {
      const response = await fetch(`${BACKEND_URL}/api/cash-records`, {
        headers: { 'Authorization': `Bearer ${authToken}` }
      });
      const result = await response.json();
      if(result.success) {
        const tbody = document.querySelector('#recordsTable tbody');
        tbody.innerHTML = result.data.map(r => `
          <tr>
            <td>${r.receiptNo}</td>
            <td>${r.payerName}</td>
            <td>₹${r.amount}</td>
            <td>${r.category}</td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align: center;">No records found</td></tr>';
      }
    } catch (err) {
      console.error("Error fetching records:", err);
    }
  }

  // 4. Add New Cash Record
  async function addCashRecord() {
    const data = {
      receiptNo: document.getElementById('receiptNo').value,
      payerName: document.getElementById('payerName').value,
      amount: Number(document.getElementById('amount').value),
      category: document.getElementById('category').value,
      agent: "Admin"
    };

    const response = await fetch(`${BACKEND_URL}/api/cash-records`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}` 
      },
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if(result.success) {
      alert("Cash record saved successfully!");
      fetchRecords();
    } else {
      alert("Error saving record");
    }
  }

  function logout() {
    firebase.auth().signOut().then(() => location.reload());
  }
</script>

</body>
</html>
